spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false

app.vehicle.import.enabled=false
app.vehicle.import.auto-startup=false
app.poi.import.enabled=false
app.goods.import.enabled=false
app.simulation.startup-pre-generation.enabled=false

# The JDBC URL is supplied only by SandboxMariaDbIntegrationTestSupport.
# Keeping a deliberately invalid default prevents accidental fallback to application.properties.
spring.datasource.url=jdbc:mariadb://invalid-sandbox-host/invalid_sandbox_database
spring.datasource.username=invalid
spring.datasource.password=invalid
spring.datasource.hikari.connection-init-sql=SET SESSION sql_mode='NO_ZERO_IN_DATE,NO_ZERO_DATE,NO_ENGINE_SUBSTITUTION'
