# Phase three can load this profile only from RUN_SPEC_READY, but the explicit runtime blocker
# still rejects formal simulation until controlled execution is implemented later.
# Path freezing is deferred; external route responses are outside prepared-run fingerprints.
# SandboxWorkspaceCli never activates this profile.
spring.datasource.url=${SANDBOX_DB_URL:jdbc:mysql://localhost:3306/vehicle_scheduler_sandbox?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${SANDBOX_DB_USER:road_sandbox_runtime}
spring.datasource.password=${SANDBOX_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

app.vehicle.import.enabled=false
app.vehicle.import.auto-startup=false
app.poi.import.enabled=false
app.goods.import.enabled=false
app.simulation.startup-pre-generation.enabled=false
