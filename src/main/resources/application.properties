spring.application.name=RoadSimulation

spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_scheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=

# ?JPA?????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html

spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# per simulation need 5 second
# per simulation = 30 min
simulation.loop.interval-ms=5000
simulation.loop.minutes-per-loop=30

gaode.api.key=07af4682e25e80dfd3381e31a790ff7a

# ????????
app.vehicle.import.enabled=true
app.vehicle.import.file=car_data.json
app.vehicle.import.auto-startup=true

# ????
logging.level.org.example.roadsimulation.service.impl.VehicleDataImportServiceImpl=INFO

# POI ??????
app.poi.import.enabled=false
poi.import.file=poi_data.json

# ??????????
app.goods.import.enabled=false
goods.import.file=goods_data.json

# Temporarily disable startup processing shipment / assignment pre-generation.
# Set to true only when this module is ready to participate in simulation startup again.
app.simulation.startup-pre-generation.enabled=false

# ORIGINAL strategy VRP multi-order packing constraints.
app.simulation.original-vrp.min-load-factor=0.80
app.simulation.original-vrp.max-anchor-distance-km=400.0
app.simulation.original-vrp.max-marginal-cost=4000.0
app.simulation.original-vrp.min-added-tons-per-extra-km=0.02

# chche
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h
# Phase 6A：评价阈值属于口径配置；Phase 6B 快照必须同时暴露实际采用值。
simulation.evaluation.low-load-ratio-threshold=0.50
simulation.evaluation.full-load-ratio-threshold=0.90
simulation.evaluation.max-service-wait-seconds=7200

# Phase 9B-1: deterministic delivery SLA contract used only by the evaluation fact boundary.
# 1.30 is a static geometric-to-reference-road factor; it is not the unsupported dynamic distance factor.
simulation.evaluation.delivery-sla.model-id=DETERMINISTIC_DISTANCE_SLA_V1
simulation.evaluation.delivery-sla.road-distance-factor=1.30
# Phase 9B-1: keep the SLA reference speed aligned with the reproducible scenario's normal network speed.
simulation.evaluation.delivery-sla.reference-speed-kph=${simulation.environment.normal-network-speed-kph:60.0}

# Phase 8: reproducible diesel-equivalent energy and direct-operation carbon proxy model.
# Model id must be changed whenever any boundary or coefficient changes between runs.
simulation.evaluation.emission.model-id=DIESEL_FLEET_PAYLOAD_PROXY_V1
simulation.evaluation.emission.base-fuel-liters-per-km=0.25
simulation.evaluation.emission.direct-emission-kg-per-liter=2.68
simulation.evaluation.emission.load-factor-beta=0.20
simulation.evaluation.emission.environment-factor-gamma=0.30
# Phase 8: payload-capacity class boundaries (tonnes) and vehicle correction factors.
simulation.evaluation.emission.l1-max-capacity-tonnes=2.0
simulation.evaluation.emission.l2-max-capacity-tonnes=5.0
simulation.evaluation.emission.medium-max-capacity-tonnes=8.0
simulation.evaluation.emission.l1-vehicle-factor=0.50
simulation.evaluation.emission.l2-vehicle-factor=0.85
simulation.evaluation.emission.medium-vehicle-factor=1.00
simulation.evaluation.emission.heavy-vehicle-factor=1.40

# Phase 7D: deterministic per-tick environment facts shared by evaluation and backend progress.
# Only travel-time efficiency changes; route geometry, vehicle lifecycle rules and frontend animation stay unchanged.
simulation.environment.scenario-id=deterministic-network-cycle
simulation.environment.seed=0
simulation.environment.modeled-road-count=100
simulation.environment.normal-network-speed-kph=60.0
# Phase 7D: production must keep this true; false is reserved for explicit Shadow Mode tests.
simulation.environment.apply-to-progress=true
